name: KPCG Climate Intelligence

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-climate-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify climate-intelligence contracts
        run: node scripts/climate-intelligence-smoke.mjs
      - name: Prepare and verify ADM0-ADM3 geography
        run: npm run admin:prepare
      - name: Exercise administrative map hierarchy
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
          npm run test:admin-map
