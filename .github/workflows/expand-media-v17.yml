name: Expand KPCG v17 Official Media

on:
  push:
    branches:
      - remediation-v17-single-baseline
    paths:
      - scripts/expand-official-media.mjs
      - .github/workflows/expand-media-v17.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation-v17-single-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand Multimedia with official KPCG photographs
        run: |
          set -euo pipefail
          node scripts/expand-official-media.mjs
          grep -q 'const v17OfficialGalleryImages=' public/index.html
      - name: Commit expanded media baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Expand Multimedia with official KPCG image library'
          git push origin HEAD:remediation-v17-single-baseline
