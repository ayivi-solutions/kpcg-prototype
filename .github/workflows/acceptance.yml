name: KPCG Acceptance

on:
  push:
    branches:
      - main
      - acceptance-hardening-v16-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reconstruct and validate v16 runtime release
        run: node scripts/acceptance-smoke.mjs

      - name: Audit strict public visual-asset quality
        continue-on-error: true
        run: node scripts/acceptance-smoke.mjs --strict-assets
