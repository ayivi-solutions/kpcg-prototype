name: KPCG Acceptance

on:
  push:
    branches:
      - main
      - acceptance-hardening-v16-1
      - acceptance-qa-v16-1
      - repair-v16-1-public-assets
      - real-kpcg-imagery-v16-2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KPCG_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project tooling
        run: npm install --no-audit --no-fund

      - name: Enforce strict public visual-asset quality
        run: npm run acceptance:assets

      - name: Run strict release verification
        run: npm run verify:strict

      - name: Emit reconstructed v16.2 acceptance artifacts
        run: node scripts/acceptance-smoke.mjs --strict-assets --emit-artifacts

      - name: Install Playwright browser QA tooling
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser smoke against Wrangler preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes wrangler@4.131.1 dev --local --port 8787 > artifacts/wrangler-preview.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat artifacts/wrangler-preview.log
            exit 1
          fi
          KPCG_PREVIEW_URL=http://127.0.0.1:8787 node scripts/browser-smoke.mjs
          KPCG_PREVIEW_URL=http://127.0.0.1:8787 node scripts/sw-cache-smoke.mjs

      - name: Upload rendered acceptance and browser-QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpcg-v16.2-acceptance-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KPCG_COMMIT_SHA: ${{ github.sha }}
      KPCG_PRODUCTION_URL: https://kpcg.ayivisolutions.com
    steps:
      - name: Check out accepted main commit
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser QA tooling
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for Cloudflare Git deployment to expose accepted release bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          expected_sha='1cef51ee7cf36c4e8b06c85c79b55d54b9fe9c7b62369148cab6dfbfc38ffb4a'
          ready=0
          for attempt in {1..24}; do
            release_query="release=${GITHUB_SHA}-${attempt}"
            if curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' \
                 -o /tmp/kpcg-featured.jpg "${KPCG_PRODUCTION_URL}/assets/real/featured-community-tree-action.jpg?${release_query}" \
              && [ "$(wc -c < /tmp/kpcg-featured.jpg)" -ge 40000 ] \
              && [ "$(sha256sum /tmp/kpcg-featured.jpg | awk '{print $1}')" = "$expected_sha" ] \
              && curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "${KPCG_PRODUCTION_URL}/?${release_query}" | grep -q 'KPCGApplyRealImageryV162' \
              && curl --fail --silent --show-error --max-time 15 -H 'Cache-Control: no-cache' "${KPCG_PRODUCTION_URL}/sw.js?${release_query}" | grep -q 'kpcg-v16.2-20260912'; then
              ready=1
              break
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Cloudflare production did not expose the v16.2 verified-imagery release bytes within the verification window.'
            exit 1
          fi

      - name: Run production desktop/mobile, route, asset and service-worker smoke
        run: |
          KPCG_PREVIEW_URL="$KPCG_PRODUCTION_URL" KPCG_PRODUCTION_MODE=1 node scripts/browser-smoke.mjs
          KPCG_PREVIEW_URL="$KPCG_PRODUCTION_URL" node scripts/sw-cache-smoke.mjs

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpcg-v16.2-production-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
