name: KPCG Acceptance

on:
  push:
    branches:
      - main
      - remediation-v17-single-baseline
      - hardening-v17-1-ip-guardrails
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KPCG_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Install project tooling
        run: npm install --no-audit --no-fund

      - name: Validate proposed production architecture reference
        run: node scripts/validate-production-reference.mjs

      - name: Enforce v18 root and preserved-v17 official-media quality
        run: npm run acceptance:assets

      - name: Run strict release verification
        run: npm run verify:strict

      - name: Emit v18 continuous-root and v17 fallback acceptance artifacts
        run: node scripts/acceptance-smoke.mjs --strict-assets --emit-artifacts

      - name: Install browser QA tooling
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run continuous-scroll, compatibility, theme, service-worker and IP-guard QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes wrangler@4.131.1 dev --local --port 8787 > artifacts/wrangler-preview.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:8787/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat artifacts/wrangler-preview.log
            exit 1
          fi
          KPCG_PREVIEW_URL=http://127.0.0.1:8787 node scripts/browser-smoke.mjs
          KPCG_PREVIEW_URL=http://127.0.0.1:8787 node scripts/theme-smoke.mjs
          KPCG_PREVIEW_URL=http://127.0.0.1:8787 node scripts/sw-cache-smoke.mjs
          KPCG_PREVIEW_URL=http://127.0.0.1:8787 node scripts/ip-hardening-smoke.mjs

          export CHROME_PATH="$(node -e "const {chromium}=require('playwright');process.stdout.write(chromium.executablePath())")"
          npx --yes lighthouse@13.4.1 'http://127.0.0.1:8787/#home' \
            --output=json --output=html --output-path=artifacts/lighthouse-mobile \
            --chrome-flags='--headless --no-sandbox' --quiet
          node scripts/lighthouse-gate.mjs artifacts/lighthouse-mobile.report.json

      - name: Upload v18 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpcg-v18-acceptance-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KPCG_COMMIT_SHA: ${{ github.sha }}
      KPCG_PRODUCTION_URL: https://kpcg.ayivisolutions.com
    steps:
      - name: Check out accepted main commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Install browser QA tooling
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for Cloudflare to expose continuous-scroll release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ready=0
          for attempt in {1..30}; do
            release_query="release=${GITHUB_SHA}-${attempt}"
            source="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "${KPCG_PRODUCTION_URL}/?${release_query}" || true)"
            legacy="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "${KPCG_PRODUCTION_URL}/legacy.html?${release_query}" || true)"
            sw="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "${KPCG_PRODUCTION_URL}/sw.js?${release_query}" || true)"
            guard="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "${KPCG_PRODUCTION_URL}/ip-guard.js?${release_query}" || true)"
            if grep -q 'data-release="v18.0"' <<<"$source" \
              && grep -q 'class="section-rail"' <<<"$source" \
              && grep -q 'id="where-we-work"' <<<"$source" \
              && grep -q 'Climate governance that connects people, evidence and action.' <<<"$source" \
              && grep -q '/ip-guard.js?v=18.1' <<<"$source" \
              && grep -q 'data-release="v17.0"' <<<"$legacy" \
              && grep -q 'kpcg-v18.0-continuous-20260914' <<<"$sw" \
              && grep -q 'v18.1-theme-20260914' <<<"$guard"; then
              ready=1
              break
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Cloudflare production did not expose the v18 continuous-scroll release within the verification window.'
            exit 1
          fi

      - name: Run production continuous-scroll, compatibility, theme and IP-protection QA
        run: |
          KPCG_PREVIEW_URL="$KPCG_PRODUCTION_URL" KPCG_PRODUCTION_MODE=1 node scripts/browser-smoke.mjs
          KPCG_PREVIEW_URL="$KPCG_PRODUCTION_URL" KPCG_PRODUCTION_MODE=1 node scripts/theme-smoke.mjs
          KPCG_PREVIEW_URL="$KPCG_PRODUCTION_URL" node scripts/sw-cache-smoke.mjs
          KPCG_PREVIEW_URL="$KPCG_PRODUCTION_URL" KPCG_PRODUCTION_MODE=1 node scripts/ip-hardening-smoke.mjs

      - name: Run production mobile Lighthouse audit
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(node -e "const {chromium}=require('playwright');process.stdout.write(chromium.executablePath())")"
          npx --yes lighthouse@13.4.1 "${KPCG_PRODUCTION_URL}/#home" \
            --output=json --output=html --output-path=artifacts/lighthouse-production-mobile \
            --chrome-flags='--headless --no-sandbox' --quiet
          node scripts/lighthouse-gate.mjs artifacts/lighthouse-production-mobile.report.json

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpcg-v18-production-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
