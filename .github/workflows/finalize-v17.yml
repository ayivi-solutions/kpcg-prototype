name: Finalize KPCG v17 Experience

on:
  push:
    branches:
      - remediation-v17-single-baseline
    paths:
      - scripts/finalize-v17-experience.mjs
      - .github/workflows/finalize-v17.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation-v17-single-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize final v17 experience
        run: |
          set -euo pipefail
          node scripts/finalize-v17-experience.mjs
          grep -q 'Preview publishing workflow' public/index.html
          grep -q 'Kenya Platform for Climate Governance</title>' public/index.html
      - name: Commit final v17 experience
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Finalize v17 imagery, metadata and CMS visibility'
          git push origin HEAD:remediation-v17-single-baseline
