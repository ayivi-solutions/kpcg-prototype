name: Repair KPCG v17 Local Service Worker

on:
  push:
    branches:
      - remediation-v17-single-baseline
    paths:
      - '.github/workflows/repair-local-sw-v17.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation-v17-single-baseline
          fetch-depth: 0
      - name: Permit service worker in secure localhost QA contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          old="if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}"
          new="if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}"
          if old not in s:
              raise SystemExit('service-worker registration anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit local service-worker repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Enable service worker in localhost QA context'
          git push origin HEAD:remediation-v17-single-baseline
