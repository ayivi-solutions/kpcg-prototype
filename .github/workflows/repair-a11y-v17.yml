name: Repair KPCG v17 Accessibility

on:
  push:
    branches:
      - remediation-v17-single-baseline
    paths:
      - '.github/workflows/repair-a11y-v17.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation-v17-single-baseline
          fetch-depth: 0
      - name: Repair Lighthouse accessibility failures
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text()
          replacements=[
            ('<div id="tooltip" class="tooltip" role="tooltip"></div>', '<div id="tooltip" class="tooltip" role="tooltip" aria-label="Context information"></div>'),
            ('<a class="brand" href="#/home" aria-label="KPCG home">', '<a class="brand" href="#/home">'),
            ('.v16-pulse-item span{font-size:.78rem;color:#6f7c75;text-transform:uppercase;letter-spacing:.06em;font-weight:700}', '.v16-pulse-item span{font-size:.78rem;color:#59675f;text-transform:uppercase;letter-spacing:.06em;font-weight:700}'),
            ('.v16-hero-dot{width:18px;min-width:18px;height:5px;border:0;border-radius:999px;background:rgba(255,255,255,.34);cursor:pointer;transition:.3s}.v16-hero-dot.active{width:46px;min-width:46px;background:#f0ce83}', '.v16-hero-dot{position:relative;width:28px;min-width:28px;height:28px;border:0;border-radius:999px;background:transparent;cursor:pointer;transition:.3s}.v16-hero-dot:before{content:"";position:absolute;left:5px;right:5px;top:50%;height:5px;transform:translateY(-50%);border-radius:999px;background:rgba(255,255,255,.34)}.v16-hero-dot.active{width:52px;min-width:52px;background:transparent}.v16-hero-dot.active:before{background:#f0ce83}'),
            ('<div class="v16-agenda">${upcoming.map(e=>`<article class="v16-agenda-item"><div class="v16-date">${fmtDate(e.date)}</div><div><h4>${esc(e.title)}</h4><p>${esc(e.location)} · ${esc(theme(e.themeId).title)}</p></div><a href="#/event/${e.slug}" aria-label="Open ${esc(e.title)}">→</a></article>`).join(\'\')}</div>', '<div class="v16-agenda">${upcoming.map(e=>`<article class="v16-agenda-item"><div class="v16-date">${fmtDate(e.date)}</div><div><h3>${esc(e.title)}</h3><p>${esc(e.location)} · ${esc(theme(e.themeId).title)}</p></div><a href="#/event/${e.slug}" aria-label="Open ${esc(e.title)}">→</a></article>`).join(\'\')}</div>'),
            ('.v16-agenda-item h4{margin:0 0 5px;font-size:1rem}', '.v16-agenda-item h3{margin:0 0 5px;font-size:1rem}')
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('accessibility repair anchor not found: '+old[:100])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit accessibility repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Lighthouse accessibility findings'
          git push origin HEAD:remediation-v17-single-baseline
