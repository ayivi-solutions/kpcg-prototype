name: Export KPCG Image Folders

on:
  push:
    branches:
      - repair-v16-1-public-assets
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package uploaded KPCG image folders
        run: |
          test -d public/assets/kpcg_images_v1
          test -d public/assets/kpcg_images_v2
          zip -r kpcg-facebook-images.zip public/assets/kpcg_images_v1 public/assets/kpcg_images_v2

      - name: Upload image inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpcg-facebook-images
          path: kpcg-facebook-images.zip
          if-no-files-found: error
          retention-days: 1
