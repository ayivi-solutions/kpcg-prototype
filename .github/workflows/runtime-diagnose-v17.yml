name: KPCG v17 Runtime Diagnose

on:
  push:
    branches:
      - remediation-v17-single-baseline
    paths:
      - '.github/workflows/runtime-diagnose-v17.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --no-audit --no-fund
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture runtime exception
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.1 dev --local --port 8787 > /tmp/wrangler.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            curl --fail --silent http://127.0.0.1:8787/ >/dev/null && break
            sleep 0.5
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(e.stack||e.message));
          page.on('console',m=>console.log('CONSOLE',m.type(),m.text()));
          await page.goto('http://127.0.0.1:8787/#/home',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(1500);
          const state=await page.evaluate(()=>({
            prerender:Boolean(document.querySelector('[data-prerendered-home]')),
            heroSlides:document.querySelectorAll('[data-v16-hero-slide]').length,
            bodyText:(document.body.innerText||'').slice(0,400),
            app:(document.querySelector('#app')?.innerHTML||'').slice(0,500)
          }));
          console.log('RUNTIME_STATE',JSON.stringify(state,null,2));
          console.log('PAGE_ERRORS',JSON.stringify(errors,null,2));
          await browser.close();
          if(errors.length) process.exitCode=1;
          NODE
