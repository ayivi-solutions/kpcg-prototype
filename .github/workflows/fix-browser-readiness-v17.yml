name: Fix KPCG v17 Browser Readiness

on:
  push:
    branches:
      - remediation-v17-single-baseline
    paths:
      - '.github/workflows/fix-browser-readiness-v17.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation-v17-single-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Make browser QA wait for hydrated v17 hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/browser-smoke.mjs')
          s=p.read_text()
          old="""    await page.waitForFunction(()=>Boolean(document.querySelector('nav,[role=\"navigation\"]'))&&(document.body?.innerText||'').length>500,null,{timeout:30000});\n\n    const home=await page.evaluate(()=>({"""
          new="""    await page.waitForFunction(()=>Boolean(document.querySelector('nav,[role=\"navigation\"]'))&&(document.body?.innerText||'').length>500,null,{timeout:30000});\n    await page.waitForFunction(()=>!document.querySelector('[data-prerendered-home]')&&document.querySelectorAll('[data-v16-hero-slide]').length>=12&&document.querySelectorAll('[data-v16-slide]').length>=12,null,{timeout:15000});\n\n    const home=await page.evaluate(()=>({"""
          if old not in s:
              raise SystemExit('browser readiness anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/browser-smoke.mjs
      - name: Commit browser QA readiness repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/browser-smoke.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Wait for hydrated v17 hero before browser assertions'
          git push origin HEAD:remediation-v17-single-baseline
