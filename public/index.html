<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b5139">
  <meta name="description" content="Kenya Platform for Climate Governance digital platform">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>KPCG Digital Platform</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fffdf8;color:#17211d}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);text-align:center}
    .mark{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:#fff;overflow:hidden;box-shadow:0 8px 24px rgba(11,81,57,.14)}
    .mark img{width:100%;height:100%;object-fit:cover}
    .bar{height:5px;border-radius:999px;background:#e6f1eb;overflow:hidden;margin-top:18px}
    .bar:before{content:"";display:block;height:100%;width:45%;background:#0b5139;animation:load 1.1s ease-in-out infinite alternate}
    @keyframes load{to{transform:translateX(120%)}}
    @media(prefers-reduced-motion:reduce){.bar:before{animation:none;width:100%}}
    .retry{margin-top:14px;padding:10px 16px;border:0;border-radius:10px;background:#0b5139;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
<main class="boot">
  <div class="card">
    <div class="mark"><img src="/assets/kpcg-logo.webp" alt="KPCG"></div>
    <h1>Kenya Platform for Climate Governance</h1>
    <p>Loading the interactive platform…</p>
    <div class="bar" aria-hidden="true"></div>
    <p id="status" role="status" aria-live="polite" style="font-size:.875rem;color:#68766f">Preparing application</p>
  </div>
</main>
<script>
(async()=>{
  const BASE_FILES=["/app/part-01.txt","/app/part-02.txt","/app/part-03.txt","/app/part-04.txt","/app/part-05.txt"];
  const CORE_PATCHES=[
    {urls:["/app/patch-v11.txt?v=11"],fn:"KPCGApplyPatch",label:"v11 interface"},
    {urls:["/app/patch-v12.txt?v=12"],fn:"KPCGApplyImagePatch",label:"v12 imagery"},
    {urls:["/app/patch-v13.txt?v=13"],fn:"KPCGApplyPatchV13",label:"v13 acceptance"}
  ];
  const EXPERIENCE_PATCHES=[
    {urls:["/app/patch-v15-01.txt?v=15","/app/patch-v15-02.txt?v=15","/app/patch-v15-03.txt?v=15","/app/patch-v15-04.txt?v=15"],fn:"KPCGApplyExperienceRedesignV15",label:"v15 validated experience"},
    {urls:["/app/patch-v16-01.txt?v=16","/app/patch-v16-02.txt?v=16"],fn:"KPCGApplyExperiencePatchV16",label:"v16 public experience"},
    {urls:["/app/patch-v16-2-real-imagery.txt?v=162"],fn:"KPCGApplyRealImageryV162",label:"real KPCG imagery"}
  ];
  const FETCH_TIMEOUT_MS=12000;
  const status=document.getElementById('status');

  const setStatus=text=>{if(status)status.textContent=text};

  const fetchText=async(url,{cache="no-cache",timeout=FETCH_TIMEOUT_MS}={})=>{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(new DOMException(`Timed out loading ${url}`,'TimeoutError')),timeout);
    try{
      const response=await fetch(url,{cache,signal:controller.signal});
      if(!response.ok)throw new Error(`${url} returned ${response.status}`);
      return await response.text();
    }finally{
      clearTimeout(timer);
    }
  };

  const ungzipB64=async b64=>{
    if(!('DecompressionStream' in window))throw new Error('This browser does not support the required decompression API.');
    const raw=Uint8Array.from(atob(String(b64).trim()),c=>c.charCodeAt(0));
    const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  };

  const validateHtml=(candidate,previous,label)=>{
    if(typeof candidate!=="string")throw new Error(`${label} returned a non-string document`);
    const html=candidate.trim();
    const previousLength=typeof previous==="string"?previous.length:0;
    const minLength=Math.max(12000,previousLength?Math.floor(previousLength*.55):0);
    if(html.length<minLength)throw new Error(`${label} produced an unexpectedly small document (${html.length} chars)`);
    if(!/<(?:!doctype|html|body)\b/i.test(html))throw new Error(`${label} produced invalid document markup`);
    if(!/(KPCG|Kenya Platform for Climate Governance)/i.test(html))throw new Error(`${label} removed the KPCG application identity`);
    if(!/(<main\b|id=["'](?:app|root)["']|data-page=|class=["'][^"']*(?:app|shell|page))/i.test(html))throw new Error(`${label} removed the principal application shell`);
    return candidate;
  };

  const evaluatePatch=async(urls,fnName,label)=>{
    const encoded=(await Promise.all(urls.map(url=>fetchText(url)))).join('');
    const patchJs=await ungzipB64(encoded);
    (0,eval)(patchJs);
    const fn=window[fnName];
    if(typeof fn!=="function")throw new Error(`${label} did not expose ${fnName}`);
    return fn;
  };

  const applyPatchSafely=async(html,patch)=>{
    try{
      const fn=await evaluatePatch(patch.urls,patch.fn,patch.label);
      return validateHtml(fn(html),html,patch.label);
    }catch(error){
      console.warn(`KPCG ${patch.label} unavailable; preserving previous stable document.`,error);
      return html;
    }
  };

  const showFatalError=error=>{
    console.error(error);
    setStatus('The application could not be loaded safely. Check your connection and retry.');
    if(!document.querySelector('.retry')){
      const button=document.createElement('button');
      button.className='retry';
      button.type='button';
      button.textContent='Retry';
      button.onclick=()=>location.reload();
      status?.after(button);
    }
  };

  try{
    setStatus('Loading application core');
    const chunks=await Promise.all(BASE_FILES.map((url,index)=>{
      setStatus(`Loading application ${index+1} of ${BASE_FILES.length}`);
      return fetchText(url);
    }));
    let html=validateHtml(await ungzipB64(chunks.join('')),null,'base application');

    setStatus('Applying stable interface updates');
    for(const patch of CORE_PATCHES)html=await applyPatchSafely(html,patch);

    setStatus('Applying validated experience redesign');
    html=await applyPatchSafely(html,EXPERIENCE_PATCHES[0]);

    setStatus('Applying public experience refinement');
    html=await applyPatchSafely(html,EXPERIENCE_PATCHES[1]);

    setStatus('Applying verified KPCG imagery');
    html=await applyPatchSafely(html,EXPERIENCE_PATCHES[2]);

    validateHtml(html,null,'final application');

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'}).catch(error=>console.warn('KPCG service worker registration failed.',error));
    }

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    showFatalError(error);
  }
})();
</script>
</body>
</html>
