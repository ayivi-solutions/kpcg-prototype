<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5139"><title>KPCG Digital Platform — Loading</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fffdf8;color:#17211d}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);text-align:center}.mark{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:#0b5139;color:white;font-weight:800;font-size:28px}.bar{height:5px;border-radius:999px;background:#e6f1eb;overflow:hidden;margin-top:18px}.bar:before{content:"";display:block;height:100%;width:45%;background:#0b5139;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(120%)}}@media(prefers-reduced-motion:reduce){.bar:before{animation:none;width:100%}}</style></head><body><main class="boot"><div class="card"><div class="mark">K</div><h1>Kenya Platform for Climate Governance</h1><p>Loading the interactive prototype…</p><div class="bar" aria-hidden="true"></div><p id="status" role="status" style="font-size:.875rem;color:#68766f">Preparing application</p></div></main><script>(async()=>{const files=["/app/part-01.txt","/app/part-02.txt","/app/part-03.txt","/app/part-04.txt","/app/part-05.txt"];const status=document.getElementById('status');const ungzipB64=async b64=>{const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('decompression');const ds=new DecompressionStream('gzip');return new Response(new Blob([raw]).stream().pipeThrough(ds)).text()};try{const chunks=await Promise.all(files.map(async(f,i)=>{status.textContent=`Loading application ${i+1} of ${files.length}`;const r=await fetch(f,{cache:'force-cache'});if(!r.ok)throw new Error('asset');return r.text()}));let html=await ungzipB64(chunks.join(''));try{status.textContent='Applying interface update';const pr=await fetch('/app/patch-v11.txt?v=11',{cache:'no-cache'});if(pr.ok){const patchJs=await ungzipB64(await pr.text());(0,eval)(patchJs);if(typeof window.KPCGApplyPatch==='function')html=window.KPCGApplyPatch(html)}}catch(patchError){console.warn('KPCG interface patch unavailable; loading base prototype.',patchError)}document.open();document.write(html);document.close()}catch(err){status.textContent='The application could not be loaded. Check your connection and retry.';const b=document.createElement('button');b.textContent='Retry';b.style='margin-top:14px;padding:10px 16px;border:0;border-radius:10px;background:#0b5139;color:white;font:inherit;font-weight:700';b.onclick=()=>location.reload();status.after(b)}})();</script></body></html>
